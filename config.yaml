engine:
  host: 0.0.0.0
  port: 8080
  startup_delay: 2
  monitoring_interval: 3
  shutdown_timeout: 10
  database_location: data/pythonengine.db
  timezone: UTC
logging:
  directory: logs
  max_bytes: 10485760
  backups: 5
authentication:
  enabled: true
  username: admin
  # default password: admin; change immediately in production
  password_hash: "$2b$12$QaQc41rtFc0QnLl8oiX7kOGErz5nOo/A6aSjq2x06e.kY/bOGQfe6"
security:
  session_secret: change-me-in-production
  csrf_secret: change-me-too
websocket:
  enabled: true
  max_clients: 500
defaults:
  cpu_limit: 80
  cpu_duration: 30
  ram_limit: 536870912
  restart_policy: on_failure
  restart_max_retries: 5
  restart_delay: 5
  restart_backoff: 2.0
  startup_delay: 2
apps: []
