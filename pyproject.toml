[project]
name = "PythonEngine"
version = "1.0.0"
description = "Production-ready lightweight Python process manager with dashboard, API, WebSockets, and monitoring."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "passlib[bcrypt]>=1.7",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "apscheduler>=3.10"
]

[project.scripts]
python-engine = "pythonengine.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"
