<!doctype html><html class="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="/static/css/app.css"><title>{{ app.config.name }}</title></head><body class="bg-slate-950 text-slate-100"><main class="p-6 max-w-7xl mx-auto"><a href="/" class="text-indigo-300">← Dashboard</a><h1 class="text-3xl font-bold my-4">{{ app.config.name }}</h1><div class="flex gap-2 mb-4"><button onclick="act('restart')" class="btn">Restart</button><button onclick="act('stop')" class="btn">Stop</button><button onclick="act('kill')" class="btn danger">Kill</button><a class="btn" href="/api/logs/{{ app.config.id }}?download=true">Download Logs</a><button onclick="clearLogs()" class="btn">Clear Logs</button></div><section class="grid md:grid-cols-3 gap-4 mb-6"><div class="card">PID <b id="pid">{{ app.pid }}</b></div><div class="card">Status <b id="status">{{ app.status }}</b></div><div class="card">Restarts <b>{{ app.restart_count }}</b></div></section><section class="card"><div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Live Console</h2><input id="search" placeholder="Search logs" class="bg-slate-800 rounded px-3 py-2"></div><pre id="console" class="h-[55vh] overflow-auto bg-black/60 rounded p-4 text-sm whitespace-pre-wrap"></pre></section></main><script>window.APP_ID="{{ app.config.id }}";window.CSRF="{{ csrf }}"</script><script src="/static/js/detail.js"></script></body></html>
