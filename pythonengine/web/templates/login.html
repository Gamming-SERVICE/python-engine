<!doctype html><html class="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>PythonEngine Login</title></head><body class="bg-slate-950 text-white min-h-screen grid place-items-center"><form method="post" class="w-96 rounded-2xl bg-slate-900/80 border border-slate-700 p-8 shadow-2xl"><h1 class="text-3xl font-bold mb-2">PythonEngine</h1><p class="text-slate-400 mb-6">Secure engine dashboard</p>{% if error %}<p class="text-red-400 mb-4">{{ error }}</p>{% endif %}<input type="hidden" name="csrf" value="{{ csrf }}"><label class="block mb-3">Username<input name="username" class="mt-1 w-full rounded bg-slate-800 p-3 border border-slate-700"></label><label class="block mb-6">Password<input type="password" name="password" class="mt-1 w-full rounded bg-slate-800 p-3 border border-slate-700"></label><button class="w-full rounded bg-indigo-500 hover:bg-indigo-400 p-3 font-semibold">Login</button></form></body></html>
