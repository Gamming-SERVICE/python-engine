<!doctype html><html class="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="/static/css/app.css"><title>PythonEngine</title></head><body class="bg-slate-950 text-slate-100"><nav class="sticky top-0 z-10 backdrop-blur bg-slate-950/80 border-b border-slate-800 px-6 py-4 flex justify-between"><b class="text-xl">PythonEngine</b><form method="post" action="/logout"><button class="text-slate-400 hover:text-white">Logout</button></form></nav><main class="p-6 max-w-7xl mx-auto"><section class="grid md:grid-cols-4 gap-4 mb-6"><div class="card"><span>Engine</span><b id="engineStatus">Online</b></div><div class="card"><span>CPU</span><b id="cpu">0%</b></div><div class="card"><span>RAM</span><b id="ram">0%</b></div><div class="card"><span>Apps</span><b id="appsCount">0</b></div></section><section class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 card"><div class="flex justify-between mb-4"><h2 class="text-xl font-bold">Applications</h2><input id="filter" placeholder="Search" class="bg-slate-800 rounded px-3 py-2"></div><div class="overflow-x-auto"><table class="w-full text-left"><thead class="text-slate-400"><tr><th>Name</th><th>Status</th><th>PID</th><th>CPU</th><th>RAM</th><th>Uptime</th><th>Restarts</th><th>Actions</th></tr></thead><tbody id="apps"></tbody></table></div></div><div class="card"><h2 class="text-xl font-bold mb-4">Latest Events</h2><ul id="events" class="space-y-3 text-sm"></ul></div></section><section class="grid md:grid-cols-2 gap-6 mt-6"><div class="card"><canvas id="cpuChart"></canvas></div><div class="card"><canvas id="ramChart"></canvas></div></section></main><script>window.CSRF="{{ csrf }}"</script><script src="/static/js/app.js"></script></body></html>
